name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      WALLSCRIBE_DISABLE_CLEANUP_THREAD: '1'
      UPLOAD_FOLDER: /tmp/wallscribe-ci-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - run: node --version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
      - run: pip install -r requirements.txt && pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/check_syntax.py
      - run: flake8 analyzers api exporters jobs models parsers routes services utils web scripts tests app.py main.py exceptions.py gunicorn_config.py --select=F401,F811,F841,F821,F822,F823 --isolated
  image:
    name: Image security (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          load: true
          tags: wallscribe:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/negitanu/WallScribe
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test production startup and pages
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run -d --name wallscribe-smoke -p 127.0.0.1:18080:8080 \
            -e WALLSCRIBE_DISABLE_CLEANUP_THREAD=1 -e SECRET_KEY=ci-smoke-only "wallscribe:ci-$ARCH"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent http://127.0.0.1:18080/lab >/dev/null
          docker run --rm --entrypoint python "wallscribe:ci-$ARCH" -c \
            'import importlib.util, os; from weasyprint import HTML; assert (os.getuid(), os.getgid()) == (999, 999); assert importlib.util.find_spec("pip") is None; assert HTML(string="<p>日本語PDF</p>").write_pdf().startswith(b"%PDF")'
          docker logs wallscribe-smoke
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f wallscribe-smoke || true
      - name: Scan the image to be published
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wallscribe-images /tmp/wallscribe-scan
          docker save --output "/tmp/wallscribe-images/wallscribe-$ARCH.tar" "wallscribe:ci-$ARCH"
          docker run --rm \
            --mount type=bind,source=/tmp/wallscribe-images,target=/images,readonly \
            --mount type=bind,source=/tmp/wallscribe-scan,target=/scan \
            "$TRIVY_IMAGE" image --scanners vuln --exit-code 1 \
            --input "/images/wallscribe-$ARCH.tar" --format json --output /scan/cves.json
      - name: Save vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallscribe-cves-${{ matrix.arch }}
          path: /tmp/wallscribe-scan/cves.json
          if-no-files-found: warn
      - name: Save tested image
        uses: actions/upload-artifact@v7
        with:
          name: wallscribe-image-${{ matrix.arch }}
          path: /tmp/wallscribe-images/*.tar
          compression-level: 0
          retention-days: 1
  publish:
    name: Docker Hub
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: dockerhub-main
      cancel-in-progress: false
    env:
      IMAGE: negitanu/wallscribe
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check publication prerequisites
        id: publish
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub upload skipped: register DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            echo "Docker image build and startup passed. Upload pending Docker Hub Secrets." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Newer main commit exists; this older image will not replace latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.publish.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download tested images
        if: steps.publish.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: wallscribe-image-*
          merge-multiple: true
          path: /tmp/wallscribe-images
      - name: Publish tested AMD64 and ARM64 images
        if: steps.publish.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load --input "/tmp/wallscribe-images/wallscribe-$arch.tar"
            docker tag "wallscribe:ci-$arch" "$IMAGE:sha-$GITHUB_SHA-$arch"
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
          done
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "Newer main commit exists; latest was not replaced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          echo "Published scanned and tested $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
