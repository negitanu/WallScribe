name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      WALLSCRIBE_DISABLE_CLEANUP_THREAD: '1'
      UPLOAD_FOLDER: /tmp/wallscribe-ci-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - run: node --version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
      - run: pip install -r requirements.txt && pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q analyzers parsers services routes exporters models
      - run: find static/js -maxdepth 1 -name '*.js' -exec node --check {} \;
      - run: flake8 analyzers parsers services routes exporters models app.py main.py --select=F821,F822,F823 --ignore= --isolated
