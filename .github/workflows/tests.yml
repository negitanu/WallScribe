name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      WALLSCRIBE_DISABLE_CLEANUP_THREAD: '1'
      UPLOAD_FOLDER: /tmp/wallscribe-ci-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - run: node --version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
      - run: pip install -r requirements.txt && pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/check_syntax.py
      - run: flake8 analyzers parsers services routes exporters models app.py main.py --select=F821,F822,F823 --ignore= --isolated
  publish:
    name: Docker Hub
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: dockerhub-main
      cancel-in-progress: false
    env:
      IMAGE: negitanu/wallscribe
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: wallscribe:ci
          cache-from: type=gha,scope=wallscribe
          cache-to: type=gha,mode=max,scope=wallscribe
      - name: Test production startup and pages
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name wallscribe-smoke -p 127.0.0.1:18080:8080 \
            -e WALLSCRIBE_DISABLE_CLEANUP_THREAD=1 -e SECRET_KEY=ci-smoke-only wallscribe:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent http://127.0.0.1:18080/lab >/dev/null
          docker logs wallscribe-smoke
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f wallscribe-smoke || true
      - name: Check publication prerequisites
        id: publish
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub upload skipped: register DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            echo "Docker image build and startup passed. Upload pending Docker Hub Secrets." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Newer main commit exists; this older image will not replace latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.publish.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push AMD64 and ARM64 images
        if: steps.publish.outputs.ready == 'true'
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            negitanu/wallscribe:latest
            negitanu/wallscribe:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/negitanu/WallScribe
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wallscribe
          cache-to: type=gha,mode=max,scope=wallscribe
      - name: Record published image
        if: steps.publish.outputs.ready == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Published $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
