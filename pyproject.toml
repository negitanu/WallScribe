[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallscribe"
version = "1.1.0"
description = "FortiGate / Palo Alto 設定からパラメータシートを生成するツール"
readme = "README.md"
requires-python = ">=3.14"
optional-dependencies.dev = [
    "black==24.10.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=1.8.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.12.0",
    "pre-commit>=3.6.0",
    "safety>=3.0.0",
    "pip-audit>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "venv", "build", "dist", "__pycache__", ".pytest_cache", "htmlcov"]
known_first_party = ["parsers", "models", "exporters", "utils", "web"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "tests/",
    "static/",
    "web/templates/",
    "build/",
    "dist/",
    ".venv/",
    "venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "pdf: PDF / WeasyPrint まわり（Linux や Docker 向けに pytest -m \"not pdf\" で除外可能）",
]
