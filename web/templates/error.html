{% extends "base.html" %}

{% block title %}エラー {{ error.code }}{% endblock %}

{% block content %}
<section class="hero hero-compact">
    <p class="eyebrow eyebrow-danger"><span class="mono">HTTP {{ error.code }}</span></p>
    <h1 class="hero-title">このページは表示できません</h1>
    <p class="hero-sub">{{ error.message }}</p>
</section>

<section class="stage-panel">
    <div class="panel panel-danger">
        <div class="panel-body">
            <p class="error-message">URL が正しいか確認するか、トップページから操作をやり直してください。</p>
            <p class="error-details mono">生成したファイルは 1 時間で自動削除されます。期限切れの場合は再生成してください。</p>
            <a href="{{ url_for('index') }}" class="btn-primary btn-md">トップに戻る</a>
        </div>
    </div>
</section>
{% endblock %}
